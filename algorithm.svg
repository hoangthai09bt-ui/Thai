<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><rect width="900" height="560" fill="#f1e7d4"/><rect x="35" y="35" width="830" height="490" rx="8" fill="#fff9ee" stroke="#bca77e" stroke-width="3"/><g stroke="#9c8d77" stroke-width="1" opacity=".35"><path d="M60 90H840M60 125H840M60 160H840M60 195H840M60 230H840M60 265H840M60 300H840M60 335H840M60 370H840M60 405H840M60 440H840M60 475H840"/></g><text x="75" y="80" font-family="Georgia" font-size="25" fill="#403c36">NOTES ON THE ANALYTICAL ENGINE · 1843</text><g fill="#4b4a48" font-family="monospace" font-size="18"><text x="80" y="145">Let n = number of terms</text><text x="80" y="180">Set initial values</text><text x="80" y="215">Repeat the operation</text><text x="80" y="250">Store intermediate results</text><text x="80" y="285">Continue until condition is met</text></g><path d="M80 320H810" stroke="#bca77e" stroke-width="2"/><text x="80" y="370" font-family="Georgia" font-size="23" fill="#765a3e">A vision of instructions for a machine.</text><text x="80" y="410" font-family="Georgia" font-size="18" fill="#8b7962">Decorative reconstruction — not a historical manuscript.</text><path d="M760 125l25 25-25 25-25-25z" fill="#a87d4f"/></svg>